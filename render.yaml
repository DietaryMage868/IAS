services:
  - type: web
    name: instant-ai-storefront
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PAYPAL_MODE
        value: sandbox
      - key: DEFAULT_SHOP_ID
        value: "123"
